[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents"
version = "0.1.0"
description = "Deep agent patterns: plan-and-execute with mid-run replanning and episodic memory"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["deepagents"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
